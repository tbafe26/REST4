spring:
  application:
    name: back
  profiles:
    active: dev # 기본은 개발 환경(파일 DB). 테스트는 test 설정으로 분리 가능
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false # 트랜잭션 경계를 스프링이 직접 관리
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update # 엔티티 기준으로 테이블 자동 생성/갱신
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
springdoc:
  default-produces-media-type: application/json;charset=UTF-8
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE